# Render Blueprint — Despliegue gratuito de AgroIA
# Uso: Render Dashboard → New + → Blueprint → seleccionar repo GitHub
# El servicio web corre en plan Free ($0) y requiere DATABASE_URL externa
# (Recomendado: Neon o Supabase Postgres con pgvector, ambos con tier gratis).

services:
  - type: web
    name: agroia-backend
    runtime: docker
    repo: https://github.com/erick880709/Agro-ia
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./apps/backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false # Pegar la URL de Neon/Supabase (postgresql+asyncpg://...) en el dashboard
      - key: ENVIRONMENT
        value: production
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PYTHONUTF8
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET
        sync: false # Pegar una clave de 32+ caracteres en el dashboard de Render
