[tool.poetry]
name = "agroia-ml"
version = "0.1.0"
description = "ML Inference Service AgroIA — scikit-learn, XGBoost, TensorFlow, MLflow"
authors = ["AgroIA Team"]
package-mode = true

[tool.poetry.dependencies]
python = "^3.11"
agroia-shared = {path = "../shared", develop = true}
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
scikit-learn = "^1.5"
xgboost = "^2.1"
mlflow = "^2.17"
grpcio = "^1.67"
grpcio-tools = "^1.67"
numpy = "^2.0"
pandas = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
