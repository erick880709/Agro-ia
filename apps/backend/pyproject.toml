[tool.poetry]
name = "agroia-backend"
version = "0.1.0"
description = "Servicio principal de negocio AgroIA — recomendaciones, catálogo, dashboards"
authors = ["AgroIA Team"]
packages = [{ include = "agroia_backend" }]

[tool.poetry.dependencies]
python = "^3.11"
agroia-shared = { path = "../shared", develop = true }
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
pydantic = {extras = ["email"], version = "^2.0"}
pydantic-settings = "^2.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
alembic = "^1.14"
redis = {extras = ["hiredis"], version = "^5.0"}
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
httpx = "^0.28"
tenacity = "^9.0"
structlog = "^24.0"
celery = {extras = ["redis"], version = "^5.4"}
python-multipart = "^0.0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
httpx = "^0.28"
ruff = "^0.8"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
