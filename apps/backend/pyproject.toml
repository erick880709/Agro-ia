[tool.poetry]
name = "agroia-backend"
version = "0.1.0"
description = "Servicio principal de negocio AgroIA — recomendaciones, catálogo, dashboards"
authors = ["AgroIA Team"]
package-mode = true

[tool.poetry.dependencies]
python = "^3.11"
agroia-shared = {path = "../shared", develop = true}
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
celery = {extras = ["redis"], version = "^5.4"}
python-multipart = "^0.0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
httpx = "^0.28"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
