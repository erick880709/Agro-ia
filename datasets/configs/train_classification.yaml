# Configuración por defecto del entrenamiento de clasificación.
# benchmark_requerido: el backend sklearn sirve de smoke-test; antes de elegir
# producción se debe ejecutar benchmark CPU con el backend torch (RNF-04).
version: 1
backend: auto
task: classification
epochs: 10
batch_size: 32
learning_rate: 0.001
image_size: 224
num_workers: 0
seed: 42
balance: balanced
augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 20
  brightness: 0.2
  contrast: 0.2
torch_arch: mobilenet_v3_small
sklearn_model: hist_gradient_boosting
early_stopping_patience: 3
output_dir: models
