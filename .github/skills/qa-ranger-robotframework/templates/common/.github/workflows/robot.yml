name: Robot Framework
on: [push, pull_request]

jobs:
  robot:
    runs-on: ubuntu-latest
    env:
      QA_RUN_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
      # Credenciales como secretos del repositorio; nunca en el código.
__GH_SECRETS__
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
__GH_EXTRA_STEP__
      - name: Ejecutar suite
        run: ./ejecutar.sh __ENV__
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-${{ env.QA_RUN_ID }}
          path: resources/qa/
