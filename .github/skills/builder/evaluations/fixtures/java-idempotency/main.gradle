allprojects {
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    test { useJUnitPlatform() }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
    }
}
