name: DORA metrics

on:
  schedule:
    - cron: '__DORA_CRON__'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect DORA metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # __DORA_ENVIRONMENT_VARS__
          DORA_OUTPUT_PATH: dora-metrics.json
        run: node scripts/dora-collect.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-dataset
          path: dora-metrics.json
          if-no-files-found: error
