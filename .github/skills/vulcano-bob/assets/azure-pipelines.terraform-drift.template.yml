trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

schedules:
  - cron: "0 5 * * *"
    displayName: Daily Terraform drift detection
    branches:
      include: [main]
    always: true

variables:
  - group: vulcano-terraform-operations

stages:
  - stage: DetectDrift
    jobs:
      - job: DriftDev
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(serviceConnectionDev)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set +e
                terraform -chdir=infra/environments/dev init -input=false
                terraform -chdir=infra/environments/dev plan -input=false -detailed-exitcode -no-color > "$(Build.ArtifactStagingDirectory)/drift-dev.txt"
                code=$?
                if [[ "$code" -eq 1 ]]; then exit 1; fi
                if [[ "$code" -eq 2 ]]; then
                  echo "##vso[task.logissue type=error]Drift detectado en dev"
                  exit 2
                fi
          - publish: $(Build.ArtifactStagingDirectory)/drift-dev.txt
            artifact: drift-report-dev
            condition: always()

      - job: DriftQa
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(serviceConnectionQa)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set +e
                terraform -chdir=infra/environments/qa init -input=false
                terraform -chdir=infra/environments/qa plan -input=false -detailed-exitcode -no-color > "$(Build.ArtifactStagingDirectory)/drift-qa.txt"
                code=$?
                if [[ "$code" -eq 1 ]]; then exit 1; fi
                if [[ "$code" -eq 2 ]]; then
                  echo "##vso[task.logissue type=error]Drift detectado en qa"
                  exit 2
                fi
          - publish: $(Build.ArtifactStagingDirectory)/drift-qa.txt
            artifact: drift-report-qa
            condition: always()

      - job: DriftProd
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(serviceConnectionProd)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set +e
                terraform -chdir=infra/environments/prod init -input=false
                terraform -chdir=infra/environments/prod plan -input=false -detailed-exitcode -no-color > "$(Build.ArtifactStagingDirectory)/drift-prod.txt"
                code=$?
                if [[ "$code" -eq 1 ]]; then exit 1; fi
                if [[ "$code" -eq 2 ]]; then
                  echo "##vso[task.logissue type=error]Drift detectado en prod"
                  exit 2
                fi
          - publish: $(Build.ArtifactStagingDirectory)/drift-prod.txt
            artifact: drift-report-prod
            condition: always()
