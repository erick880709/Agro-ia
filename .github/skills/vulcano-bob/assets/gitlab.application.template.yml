include:
  - local: .gitlab/ci/iac.yml
  - local: .gitlab/ci/drift.yml

stages: [build, plan, apply, drift, deploy]

application_build:
  stage: build
  image: $CI_BUILD_IMAGE
  script:
    - ./scripts/ci-build.sh
  artifacts:
    name: app-package
    paths: [dist/]

application_deploy:
  stage: deploy
  image: $DEPLOY_IMAGE
  id_tokens:
    VULCANO_OIDC_TOKEN:
      aud: $CLOUD_OIDC_AUDIENCE
  parallel:
    matrix:
      - DEPLOY_ENVIRONMENT: [dev, qa, prod]
  environment: $DEPLOY_ENVIRONMENT
  script:
    - ./scripts/ci-deploy.sh
    # __PROGRESSIVE_DELIVERY_ANALYSIS__
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# __PROGRESSIVE_DELIVERY_ROLLBACK_JOB__

# __NOTIFICATION_JOB__
