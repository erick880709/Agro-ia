apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __APP_NAME__-__ENVIRONMENT__
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __MANIFESTS_REPO_URL__
    targetRevision: main
    path: infra/gitops/overlays/__ENVIRONMENT__
  destination:
    server: https://kubernetes.default.svc
    namespace: __APP_NAME__-__ENVIRONMENT__
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
