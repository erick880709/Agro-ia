schema_version: 1
solution:
  id: example-solution
  name: Example Solution
  description: Replace this example with the approved architecture context.
sources:
  - path: resources/architecture
    kind: architecture
    status: pending
catalogs: []
components:
  - id: example-api
    requirement: ARQ-001
    workload: api
    repository:
      id: example-api
      path: apps/example-api
    strategy: create
    stack:
      language: python
      runtime:
        intent: stable
        scheme: pep440
      architecture_style: modular
    capabilities: []
    depends_on: []
    contracts: []
    security_requirements: []
    quality_gates:
      - build
      - unit-tests
