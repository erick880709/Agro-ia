openapi: "3.1.0"
info:
  title: AgroIA API
  description: |-
    API de AgroInteligente Colombia — Plataforma de diagnóstico agronómico inteligente.
    v0.6.0: voz personalizada clonable — subida de muestra de audio, ciclo de clonación
    en GPU cloud (clonar/estado) y síntesis con voz clonada (mi-voz). v0.5.0: lectura en
    voz alta de las respuestas del Asesor agronómico (RFP-AGROIA-002) — preferencias por
    usuario, síntesis en servidor (respaldo), métricas de lectura y voz personalizada
    (Fase 2). v0.4.0: interacción por voz (RFP-AGROIA-001). v0.3.0: módulo AGC-COST.
  version: "0.6.0"
  contact:
    name: AgroIA Team

servers:
  - url: http://localhost:8000/api/v1
    description: Desarrollo local
  - url: https://api.agroia.co/api/v1
    description: Producción

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT RS256 emitido por el Auth Service

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código de error único
          example: VALIDATION_ERROR
        message:
          type: string
          description: Mensaje descriptivo en español
          example: El campo 'email' es requerido

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        total_pages:
          type: integer
          example: 8

    VozParametros:
      type: object
      properties:
        activado:
          type: boolean
          description: Activa/desactiva la función de voz
        duracion_maxima_segundos:
          type: integer
          example: 60
        idioma:
          type: string
          example: "es"

    VozMetrica:
      type: object
      properties:
        periodo:
          type: string
          example: "2026-10"
        consultas:
          type: integer
          example: 12
        errores:
          type: integer
          example: 1
        duracion_media_ms:
          type: integer
          example: 4500

    TranscripcionResponse:
      type: object
      properties:
        texto:
          type: string
          example: "¿Qué abono debo aplicar?"
        proveedor:
          type: string
          example: "openai-whisper"

    PreferenciaLecturaVoz:
      type: object
      properties:
        activado:
          type: boolean
          example: false
        voz:
          type: string
          enum: [femenina, masculina, mi-voz]
          example: femenina
        velocidad:
          type: string
          enum: ["0.75", "1", "1.25", "1.5"]
          example: "1"

    MetricaLecturaVoz:
      type: object
      properties:
        periodo:
          type: string
          example: "2026-10"
        activaciones:
          type: integer
          example: 5
        voz_elegida:
          type: string
          example: femenina
        errores:
          type: integer
          example: 1
        caracteres_leidos:
          type: integer
          example: 3200

  responses:
    "400":
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "403":
      description: Acceso denegado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Conflicto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: Error interno
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /recomendaciones/analyze:
    post:
      summary: Analizar aptitud del suelo
      description: Pipeline completo — datos de suelo → ML → reglas → discordancia → respuesta
      tags: [Recomendaciones]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finca_id]
              properties:
                finca_id:
                  type: string
                  format: uuid
                  description: UUID de la finca a analizar
                cultivo_id:
                  type: string
                  format: uuid
                  description: UUID del cultivo objetivo (opcional)
      responses:
        "200":
          description: Recomendación generada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendResponse"
        "422":
          $ref: "#/components/responses/422"

  /recomendaciones/historial/{finca_id}:
    get:
      summary: Historial de recomendaciones por finca
      tags: [Recomendaciones]
      security:
        - bearerAuth: []
      parameters:
        - name: finca_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Lista paginada de recomendaciones

  /costeo/parametros/vigentes:
    get:
      summary: Conjunto de parámetros de costeo publicado y vigente
      description: Devuelve el conjunto vigente a la fecha con servicios, componentes, tramos, factores, política, impuestos, descuentos, densidad y zonas. Roles Admin y Agrónomo.
      tags: [Costeo]
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Fecha de referencia (hoy por defecto)
      responses:
        "200":
          description: Conjunto vigente serializado
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"

  /costeo/simular:
    post:
      summary: Calcular costeo sin persistir (motor determinista)
      description: Ejecuta la tubería de cálculo AGC-COST sobre el conjunto indicado o el vigente. Roles Admin y Agrónomo.
      tags: [Costeo]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area_ha, servicios]
              properties:
                conjunto_id:
                  type: string
                  format: uuid
                fecha_referencia:
                  type: string
                  format: date
                area_ha:
                  type: number
                puntos:
                  type: integer
                km:
                  type: number
                dificultad:
                  type: string
                departamento:
                  type: string
                municipio:
                  type: string
                descuento_pct:
                  type: number
                servicios:
                  type: array
                  items:
                    type: object
                    properties:
                      codigo:
                        type: string
                      cantidad:
                        type: number
      responses:
        "200":
          description: Desglose completo (líneas, factores, totales, advertencias, indicadores y traza)
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          description: Error de negocio del motor (TRAMOS_INCONSISTENTES, DESCUENTO_EXCEDE_TOPE, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  # ── AGC-COST F2-F7 ──────────────────────────────────────────────────────
  /costeo/conjuntos:
    get:
      summary: Listar conjuntos con estado y vigencia (Admin)
      tags: [Costeo admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Lista de conjuntos }
    post:
      summary: Crear conjunto en borrador (Admin)
      tags: [Costeo admin]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Conjunto creado }

  /costeo/conjuntos/{conjunto_id}/validar:
    post:
      summary: Validación integral previa a publicar (Admin)
      tags: [Costeo admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conjunto_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Resultado de validación (errores y advertencias) }

  /costeo/conjuntos/{conjunto_id}/publicar:
    post:
      summary: Publicar con doble control y simulación obligatoria (Admin aprobador)
      tags: [Costeo admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conjunto_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Conjunto publicado; el anterior queda archivado }
        "422": { description: APROBADOR_ES_EDITOR, CONJUNTO_INVALIDO o SIMULACION_REQUERIDA }

  /costeo/conjuntos/{conjunto_id}/clonar:
    post:
      summary: Clonar con reajuste porcentual masivo opcional (Admin)
      tags: [Costeo admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conjunto_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Conjunto clonado en borrador }

  /costeo/identidad:
    get:
      summary: Identidad y contactos vigentes para encabezados y PDF (autenticado)
      tags: [Costeo identidad]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Identidad con teléfonos ordenados }
    put:
      summary: Actualizar identidad y lista de teléfonos (Admin)
      tags: [Costeo identidad]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Identidad actualizada }

  /costeo/identidad/logo:
    post:
      summary: Cargar logo PNG/SVG con validación de formato y tamaño (Admin)
      tags: [Costeo identidad]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo: { type: string, format: binary }
                oscuro: { type: boolean }
      responses:
        "200": { description: URL estable del logo }

  /estimaciones:
    get:
      summary: Listar estimaciones (Admin/Agrónomo todas; Cliente solo las suyas)
      tags: [Estimaciones]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Lista de estimaciones }
    post:
      summary: Crear estimación en borrador con cálculo inmediato (Admin/Agrónomo)
      tags: [Estimaciones]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Estimación creada con desglose }
        "422": { description: DESCUENTO_EXCEDE_TOPE, SERVICIO_NO_ENCONTRADO, etc. }

  /estimaciones/{estimacion_id}/emitir:
    post:
      summary: Congelar snapshot SHA-256, asignar consecutivo y emitir
      tags: [Estimaciones]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estimacion_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Estimación emitida }
        "422": { description: BAJO_PISO_RENTABILIDAD, ESTIMACION_NO_EDITABLE }

  /estimaciones/{estimacion_id}/aceptar:
    post:
      summary: Registrar aceptación del cliente
      tags: [Estimaciones]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estimacion_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Estimación aceptada }
        "422": { description: ESTIMACION_VENCIDA, ESTIMACION_NO_ACEPTABLE }

  /estimaciones/{estimacion_id}/recalcular:
    post:
      summary: Recalcular con el snapshot congelado y verificar reproducibilidad (CA-07)
      tags: [Estimaciones]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estimacion_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Comparación total guardado vs. total snapshot }

  /estimaciones/{estimacion_id}/convertir-comision:
    post:
      summary: Crear la comisión asociada a una estimación aceptada (Admin)
      tags: [Estimaciones]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estimacion_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Comisión creada con referencia de origen }
        "422": { description: ESTIMACION_NO_ACEPTADA, COMISION_YA_CREADA }

  /estimaciones/{estimacion_id}/export:
    get:
      summary: Descargar la cotización HTML/PDF por audiencia (agricultor|tecnico)
      tags: [Estimaciones]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estimacion_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: formato, in: query, schema: { type: string, enum: [html, pdf] } }
        - { name: audiencia, in: query, schema: { type: string, enum: [agricultor, tecnico] } }
      responses:
        "200": { description: HTML o PDF de la cotización }

  /estimaciones/tablero:
    get:
      summary: Tablero de estimaciones: emitidas, aceptadas, conversión y ticket promedio (Admin)
      tags: [Estimaciones]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Métricas del tablero }

  /cobros:
    get:
      summary: Listar documentos de cobro (Admin)
      tags: [Cobros]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Lista de documentos }
    post:
      summary: Crear documento de cobro desde una estimación aceptada (Admin)
      tags: [Cobros]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estimacion_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Documento en borrador con líneas heredadas }

  /cobros/{documento_id}/emitir:
    post:
      summary: Asignar consecutivo con bloqueo en servidor y emitir (Admin)
      tags: [Cobros]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: documento_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Documento emitido con numeración consecutiva }
        "422": { description: NUMERACION_AGOTADA, RESOLUCION_VENCIDA, COBRO_YA_EMITIDO }

  /cobros/{documento_id}/pagos:
    post:
      summary: Registrar un pago total o parcial con recálculo de saldo (Admin)
      tags: [Cobros]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: documento_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Pago registrado; saldo y estado actualizados }

  /cobros/{documento_id}/anular:
    post:
      summary: Anular con motivo obligatorio; el documento nunca se borra (Admin)
      tags: [Cobros]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: documento_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Documento anulado con motivo }

  /cobros/{documento_id}/pdf:
    get:
      summary: Descargar el documento de cobro en PDF (Admin y cliente propietario)
      tags: [Cobros]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: documento_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: PDF del documento de cobro }

  /voz/transcripcion:
    post:
      summary: Transcribir audio a texto en español (respaldo en servidor)
      description: Respaldo del enfoque híbrido de voz (RFP-AGROIA-001). El audio se procesa y descarta sin persistencia; aplica límites de tamaño y tasa de peticiones.
      tags: [Voz]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                idioma:
                  type: string
                  default: "es"
      responses:
        "200":
          description: Transcripción realizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscripcionResponse" }
        "401": { $ref: "#/components/responses/401" }
        "503":
          description: Servicio de transcripción no disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /voz/parametros:
    get:
      summary: Parámetros vigentes de la función de voz
      tags: [Voz]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Parámetros de voz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VozParametros" }
        "401": { $ref: "#/components/responses/401" }
    put:
      summary: Actualizar parámetros de voz (solo administrador)
      tags: [Voz]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VozParametros" }
      responses:
        "200":
          description: Parámetros actualizados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VozParametros" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }

  /voz/metricas:
    get:
      summary: Agregados mensuales de uso de voz (solo administrador)
      tags: [Voz]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de métricas mensuales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VozMetrica" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
    post:
      summary: Registrar un evento de uso de voz
      tags: [Voz]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo:
                  type: string
                  enum: [consulta, error]
                duracion_ms:
                  type: integer
      responses:
        "200": { description: Evento registrado }
        "401": { $ref: "#/components/responses/401" }

  /lectura/preferencias:
    get:
      summary: Preferencia de lectura del usuario
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Preferencia de lectura
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenciaLecturaVoz" }
        "401": { $ref: "#/components/responses/401" }
    put:
      summary: Actualizar preferencia de lectura del usuario
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferenciaLecturaVoz" }
      responses:
        "200":
          description: Preferencia actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenciaLecturaVoz" }
        "401": { $ref: "#/components/responses/401" }

  /lectura/sintetizar:
    post:
      summary: Sintetizar texto a audio (respaldo en servidor)
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string }
                voz: { type: string, enum: [femenina, masculina, mi-voz], default: femenina }
                velocidad: { type: string, enum: ["0.75", "1", "1.25", "1.5"], default: "1" }
      responses:
        "200":
          description: Audio (MP3 para voz estándar; WAV para voz clonada)
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/401" }
        "503":
          description: Motor de síntesis no disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /lectura/metricas:
    get:
      summary: Agregados mensuales de lectura (solo administrador)
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de métricas mensuales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MetricaLecturaVoz" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
    post:
      summary: Registrar un evento de uso de lectura
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { type: string, enum: [activacion, error] }
                caracteres_leidos: { type: integer }
                voz_elegida: { type: string }
      responses:
        "200": { description: Evento registrado }
        "401": { $ref: "#/components/responses/401" }

  /lectura/voz-personalizada:
    get:
      summary: Estado de la voz personalizada del usuario
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Estado de la voz personalizada }
        "401": { $ref: "#/components/responses/401" }
    post:
      summary: Subir la muestra de la propia voz (inicia la clonación si hay motor configurado)
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary }
      responses:
        "200": { description: Muestra guardada y/o clonación iniciada }
        "401": { $ref: "#/components/responses/401" }
        "422": { description: Audio vacío o supera 8 MB }
    put:
      summary: Activar o desactivar la voz personalizada
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Estado actualizado }
        "401": { $ref: "#/components/responses/401" }
    delete:
      summary: Eliminar la voz personalizada (registro y muestra)
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Voz eliminada }
        "401": { $ref: "#/components/responses/401" }

  /lectura/voz-personalizada/audio:
    get:
      summary: Obtener la muestra grabada para previsualización
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Audio de la muestra (webm)
          content:
            audio/webm:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/401" }
        "404": { description: No hay muestra de voz }

  /lectura/voz-personalizada/clonar:
    post:
      summary: Enviar la muestra guardada al motor de clonación (GPU cloud)
      tags: [Lectura]
      security: [{ bearerAuth: [] }]
      responses:
